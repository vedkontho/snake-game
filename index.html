<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
    }
    .score-val {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .high-val {
      color: #f43f5e;
    }
    canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15);
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
    }
    .controls-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      width: 210px;
      height: 140px;
      margin-top: 8px;
    }
    .btn-ctrl {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      font-size: 1.5rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: active 0.1s, background 0.2s;
    }
    .btn-ctrl:active {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(0.95);
    }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 12px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .overlay p {
      color: #94a3b8;
      font-size: 1rem;
    }
    .btn-start {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transition: transform 0.15s;
    }
    .btn-start:hover {
      transform: scale(1.05);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="game-container" style="position: relative;">
    <div class="header">
      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-val" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">High Score</span>
        <span class="score-val high-val" id="high-score">0</span>
      </div>
    </div>

    <div style="position: relative; width: 100%; display: flex; justify-content: center;">
      <canvas id="canvas" width="400" height="400"></canvas>
      
      <div id="overlay" class="overlay">
        <h1 id="overlay-title">CYBER SNAKE</h1>
        <p id="overlay-msg">Press Start or Arrow Keys</p>
        <button class="btn-start" id="start-btn">PLAY GAME</button>
      </div>
    </div>

    <div class="controls-panel">
      <button class="btn-ctrl btn-up" id="ctrl-up">▲</button>
      <button class="btn-ctrl btn-left" id="ctrl-left">◄</button>
      <button class="btn-ctrl btn-down" id="ctrl-down">▼</button>
      <button class="btn-ctrl btn-right" id="ctrl-right">►</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const GRID_SIZE = 20;
    const TILE_COUNT = 20;
    let speed = 100; // ms

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high_score') || 0;
    let gameLoop = null;
    let isPlaying = false;

    highScoreEl.textContent = highScore;

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundEat() { playSound(600, 'sine', 0.1); }
    function soundDie() { playSound(150, 'sawtooth', 0.4); }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.textContent = score;
      spawnFood();
    }

    function spawnFood() {
      while (true) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        let collision = snake.some(part => part.x === food.x && part.y === food.y);
        if (!collision) break;
      }
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(gameLoop);
      soundDie();
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high_score', highScore);
        highScoreEl.textContent = highScore;
      }
      overlayTitle.textContent = "GAME OVER";
      overlayMsg.textContent = `Final Score: ${score}`;
      startBtn.textContent = "PLAY AGAIN";
      overlay.classList.remove('hidden');
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        soundEat();
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * GRID_SIZE, (food.y + 0.5) * GRID_SIZE, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Snake
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#0284c7';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(part.x * GRID_SIZE + 1, part.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
      ctx.shadowBlur = 0;
    }

    function setDir(newDx, newDy) {
      if (!isPlaying) {
        startGame();
        return;
      }
      if (newDx !== -dx || newDy !== -dy) {
        nextDx = newDx;
        nextDy = newDy;
      }
    }

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
      }
    });

    document.getElementById('ctrl-up').addEventListener('click', () => setDir(0, -1));
    document.getElementById('ctrl-down').addEventListener('click', () => setDir(0, 1));
    document.getElementById('ctrl-left').addEventListener('click', () => setDir(-1, 0));
    document.getElementById('ctrl-right').addEventListener('click', () => setDir(1, 0));

    startBtn.addEventListener('click', startGame);

    draw();
  </script>
</body>
</html>
