<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
    }
    .score-val {
      font-size: 1.4rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .high-val {
      color: #f43f5e;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
    }
    canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 12px;
      z-index: 999;
      cursor: pointer;
    }
    .overlay h1 {
      font-size: 2.2rem;
      color: #38bdf8;
    }
    .overlay p {
      color: #94a3b8;
      font-size: 1rem;
    }
    .btn-start {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 14px 36px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .controls-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      width: 210px;
      height: 130px;
    }
    .btn-ctrl {
      background: #1e293b;
      border: 1px solid #475569;
      color: #38bdf8;
      font-size: 1.8rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-ctrl:active {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-val" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">High Score</span>
        <span class="score-val high-val" id="high-score">0</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="400" height="400"></canvas>
      
      <div id="overlay" class="overlay">
        <h1 id="overlay-title">CYBER SNAKE</h1>
        <p id="overlay-msg">Tap Anywhere to Play</p>
        <button class="btn-start" id="start-btn">PLAY GAME</button>
      </div>
    </div>

    <div class="controls-panel">
      <button class="btn-ctrl btn-up" id="ctrl-up">&#9650;</button>
      <button class="btn-ctrl btn-left" id="ctrl-left">&#9664;</button>
      <button class="btn-ctrl btn-down" id="ctrl-down">&#9660;</button>
      <button class="btn-ctrl btn-right" id="ctrl-right">&#9654;</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('score');
    var highScoreEl = document.getElementById('high-score');
    var overlay = document.getElementById('overlay');
    var overlayTitle = document.getElementById('overlay-title');
    var overlayMsg = document.getElementById('overlay-msg');
    var startBtn = document.getElementById('start-btn');

    var GRID_SIZE = 20;
    var TILE_COUNT = 20;
    var speed = 100;

    var snake = [];
    var food = { x: 5, y: 5 };
    var dx = 1;
    var dy = 0;
    var nextDx = 1;
    var nextDy = 0;
    var score = 0;
    var highScore = localStorage.getItem('snake_high_score') || 0;
    var gameLoop = null;
    var isPlaying = false;

    highScoreEl.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.textContent = '0';
      spawnFood();
    }

    function spawnFood() {
      while (true) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        var collision = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === food.x && snake[i].y === food.y) {
            collision = true;
            break;
          }
        }
        if (!collision) break;
      }
    }

    function startGame(e) {
      if (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      }
      resetGame();
      isPlaying = true;
      overlay.style.display = 'none';
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
      draw();
    }

    // Attach robust touch + click handlers for Start
    ['click', 'touchstart', 'pointerdown'].forEach(function(evt) {
      overlay.addEventListener(evt, startGame, { passive: false });
      startBtn.addEventListener(evt, startGame, { passive: false });
    });

    function gameOver() {
      isPlaying = false;
      if (gameLoop) clearInterval(gameLoop);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high_score', highScore);
        highScoreEl.textContent = highScore;
      }
      overlayTitle.textContent = "GAME OVER";
      overlayMsg.textContent = "Final Score: " + score;
      startBtn.textContent = "PLAY AGAIN";
      overlay.style.display = 'flex';
    }

    function update() {
      if (!isPlaying) return;
      dx = nextDx;
      dy = nextDy;

      var head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0) head.x = TILE_COUNT - 1;
      if (head.x >= TILE_COUNT) head.x = 0;
      if (head.y < 0) head.y = TILE_COUNT - 1;
      if (head.y >= TILE_COUNT) head.y = 0;

      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (var i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * GRID_SIZE, (food.y + 0.5) * GRID_SIZE, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      for (var j = 0; j < snake.length; j++) {
        ctx.fillStyle = j === 0 ? '#38bdf8' : '#0284c7';
        ctx.fillRect(snake[j].x * GRID_SIZE + 1, snake[j].y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      }
    }

    function setDir(newDx, newDy, e) {
      if (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      }
      if (!isPlaying) {
        startGame();
        return;
      }
      if (newDx !== -dx || newDy !== -dy) {
        nextDx = newDx;
        nextDy = newDy;
      }
    }

    // Attach Directional Button handlers
    function bindBtn(id, ndx, ndy) {
      var btn = document.getElementById(id);
      ['click', 'touchstart', 'pointerdown'].forEach(function(evt) {
        btn.addEventListener(evt, function(e) { setDir(ndx, ndy, e); }, { passive: false });
      });
    }

    bindBtn('ctrl-up', 0, -1);
    bindBtn('ctrl-left', -1, 0);
    bindBtn('ctrl-down', 0, 1);
    bindBtn('ctrl-right', 1, 0);

    document.addEventListener('keydown', function(e) {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
      }
    });

    var touchStartX = 0;
    var touchStartY = 0;

    canvas.addEventListener('touchstart', function(e) {
      if (e.changedTouches && e.changedTouches[0]) {
        touchStartX = e.changedTouches[0].clientX;
        touchStartY = e.changedTouches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener('touchend', function(e) {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      var diffX = e.changedTouches[0].clientX - touchStartX;
      var diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 25) setDir(1, 0);
        else if (diffX < -25) setDir(-1, 0);
      } else {
        if (diffY > 25) setDir(0, 1);
        else if (diffY < -25) setDir(0, -1);
      }
    }, { passive: true });

    draw();
  </script>
</body>
</html>
